# YCFMG 配置示例（复制为 config.yaml 后按需修改）
server:
  host: 0.0.0.0
  port: 8686
  # 飞牛统一网关 Unix Socket（由 fpk 启动脚本传入，通常无需手工配置）
  socket: 
  # 分享专用端口：填了就用它对外提供分享页（只放行 /s/ 与静态资源）；0 = 关闭
  share_port: 0
  base_path: ""
  trust_proxy: true
# 多域名绑定：访问者用哪个域名进来，分享链接就用哪个域名生成；留空则使用当前访问地址
  public_urls: []
data_dir: /opt/ycfmg/data
libraries:
  - name: 照片
    path: /vol1/1000/Photos
    readonly: false
    index: true
  - name: 下载
    path: /vol1/1000/Downloads
    readonly: true
    index: true
auth:
  username: admin
  password: ""
  session_ttl_hours: 1728
index:
  enabled: true
  scan_interval_minutes: 360
  thumb_sizes: [256, 768]
  auto_tags: true
  hash_tolerance: 6
  max_file_mb: 512
share:
  default_expire_days: 7
  max_items: 2000
  allow_download: true
  brand_name: YCFMG
  brand_subtitle: 文件管理 · 智能图库
semantic:
  enabled: false
  endpoint: ""
  api_key: ""
  model: clip-vit-base-patch32
log_level: info
# 在线更新检查（应用内「设置 → 在线更新」）
update:
  enabled: true
  check_interval_hours: 12
  download_page: https://ycfmg.202693.xyz
  proxy: ""
  github_repo: YCyingchen/YCFMG
  docker_repo: ycyingchen/ycfmg
  sources: []
